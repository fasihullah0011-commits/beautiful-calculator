<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10131c" />
    <meta name="description" content="A beautiful, lightweight calculator for everyday math." />
    <title>Beautiful Calculator</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Beautiful Calculator home">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>little<span class="brand-light">math</span></span>
        </a>
        <span class="top-note"><span class="status-dot"></span> YOUR MOMENT OF CLARITY</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">A CALCULATOR, MADE CALMER</p>
        <h1 id="page-title">Make room for <span>good math.</span></h1>
        <p class="intro-copy">The little things add up. Make them feel simple.</p>
      </section>

      <section class="calculator" aria-label="Calculator">
        <div class="display" aria-live="polite" aria-atomic="true">
          <div class="display-label"><span>YOUR CALCULATION</span><span class="display-indicator">● READY</span></div>
          <div class="expression" id="expression" aria-label="Expression">0</div>
          <div class="result-line"><span class="result-caption" id="result-caption">RESULT</span><output class="result" id="result" aria-label="Result">0</output></div>
        </div>
        <div class="keypad" id="keypad" aria-label="Calculator keys">
          <button class="key key-utility" data-action="clear" aria-label="Clear all">AC</button>
          <button class="key key-utility" data-value="(" aria-label="Open parenthesis">(</button>
          <button class="key key-utility" data-value=")" aria-label="Close parenthesis">)</button>
          <button class="key key-operator" data-value="÷" aria-label="Divide">÷</button>

          <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key key-operator" data-value="×" aria-label="Multiply">×</button>
          <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key key-operator" data-value="−" aria-label="Subtract">−</button>
          <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key key-operator" data-value="+" aria-label="Add">+</button>

          <button class="key key-utility" data-action="backspace" aria-label="Delete last character">⌫</button>
          <button class="key" data-value="0">0</button>
          <button class="key" data-value="." aria-label="Decimal point">.</button>
          <button class="key key-equals" data-action="equals" aria-label="Calculate">=</button>
        </div>
        <div class="calculator-footer"><span>TIP: YOU CAN ALSO USE YOUR KEYBOARD</span><span class="keyboard-hint"><kbd>↵</kbd> calculate</span></div>
      </section>

      <footer class="page-footer">
        <span>Made for everyday little wins <span class="heart" aria-label="love">♥</span></span>
        <a href="https://github.com/fasihullah0011-commits/beautiful-calculator">OPEN SOURCE ON GITHUB ↗</a>
      </footer>
    </main>
  </body>
</html>
